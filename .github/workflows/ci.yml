name: CI

on:
  workflow_dispatch:

# Scope: this repository ships the DeepSeek Harness bundle. Claude Code and
# Codex manifest / marketplace-bundle validation belongs to those
# distributions, so only the dsh pipeline is wired up here.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy src/

  # DeepSeek Harness bundle contract: the npm package, its cordis patch layer
  # and the self-locating path service must stay consistent with the shipped
  # skills, and the packed tarball must carry the layer.
  dsh-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Syntax-check the dsh bundle entry
        run: node --check dsh/paths.mjs
      - name: Validate the dsh bundle contract
        run: uv run pytest tests/test_dsh_plugin.py -q
      - name: Verify the npm tarball contents
        run: npm pack --dry-run

  test-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # The Claude/Codex manifest and marketplace-bundle contracts ship with
      # those hosts, not with this pipeline.
      - run: |
          uv run pytest tests/ -v -m "not integration" --cov --cov-report=xml \
            --ignore=tests/test_plugin_manifest.py \
            --ignore=tests/test_plugin_bundle.py
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit-tests

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -v -m "integration"

  # 打包产物 smoke test - 验证 wheel 安装后 console script 正常工作
  test-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build wheel
        run: |
          uv sync --all-extras
          uv build
      - name: Install from wheel
        run: |
          # 创建临时虚拟环境进行安装测试
          python -m venv /tmp/test-venv
          source /tmp/test-venv/bin/activate
          pip install dist/autocode_mcp-*.whl
          pip install pytest pytest-asyncio
      - name: Run packaging smoke tests
        run: |
          source /tmp/test-venv/bin/activate
          pytest tests/test_e2e_mcp.py -v -m "packaging"
      - name: Verify console script
        run: |
          source /tmp/test-venv/bin/activate
          autocode-mcp --help || true  # --help 可能返回非 0，但命令应该存在
          # 验证 MCP 握手
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | timeout 5 autocode-mcp | head -1
